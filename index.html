<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>摘务</title>
<style id="zhaiwu-style">
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --line: #e2e5ea;
    --text: #1b1d21;
    --muted: #6b7280;
    --accent: #2f6feb;
    --warn: #a15c07;
    --danger: #b91c1c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 28px 16px 72px;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.65 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: 0.02em; }
  .tagline { margin: 0; color: var(--muted); font-size: 14px; }
  header { margin-bottom: 20px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 8px; }
  textarea, input[type=text] {
    width: 100%;
    font: inherit;
    color: inherit;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px;
  }
  textarea { resize: vertical; min-height: 120px; }
  textarea:focus, input[type=text]:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
    border-color: transparent;
  }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  button {
    font: inherit;
    padding: 8px 16px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: inherit;
    cursor: pointer;
    flex: 0 0 auto;
  }
  button:hover { background: #f1f3f6; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: #2a62d0; }
  .hint { color: var(--muted); font-size: 13px; margin: 10px 0 0; }
  .group + .group { margin-top: 22px; }
  .group-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    margin: 0 0 6px;
  }
  ul.tasks { list-style: none; margin: 0; padding: 0; }
  li.task {
    display: flex;
    gap: 12px;
    align-items: baseline;
    padding: 10px 0;
    border-top: 1px solid var(--line);
  }
  li.task:first-child { border-top: none; }
  .task-when {
    flex: 0 0 auto;
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
    white-space: nowrap;
  }
  .task-when.none { color: var(--muted); }
  .task-text { flex: 1 1 auto; word-break: break-word; }
  .badge {
    display: inline-block;
    font-size: 12px;
    line-height: 1.5;
    color: var(--warn);
    border: 1px solid currentColor;
    border-radius: 4px;
    padding: 0 4px;
    margin-left: 6px;
    white-space: nowrap;
    cursor: help;
  }
  .badge.manual { color: var(--muted); }
  .task-del {
    flex: 0 0 auto;
    border: none;
    background: none;
    color: var(--muted);
    padding: 2px 4px;
    font-size: 13px;
  }
  .task-del:hover { background: none; color: var(--danger); }
  .empty { color: var(--muted); font-size: 14px; margin: 0; }
  .empty strong { color: var(--text); }
  .actions { margin-top: 14px; }
  /* pointer-events 关掉，否则 :hover 仍会匹配 disabled 按钮，看着像可点 */
  .actions button:disabled { opacity: .45; pointer-events: none; }
</style>
</head>
<body>

<div class="wrap">

  <header>
    <h1>摘务</h1>
    <p class="tagline">粘贴聊天记录，抽出「要做什么 + 什么时候前做完」，按紧急度排好序。</p>
  </header>

  <section class="panel">
    <label class="label" for="chat-input">① 粘贴聊天记录（≤10 条，每条一行）</label>
    <textarea id="chat-input" placeholder="例如：&#10;收到&#10;明天下午三点前把上周的报表发我一下&#10;另外记得周五之前跟客户确认交付时间"></textarea>
    <div class="row">
      <button id="extract-btn" class="primary" type="button">抽取</button>
      <span id="hint" class="hint" style="margin:0"></span>
    </div>
  </section>

  <section class="panel">
    <div id="results"></div>
    <div class="row actions">
      <button id="copy-btn" class="primary" type="button" disabled>复制为 Markdown</button>
      <button id="download-btn" type="button" disabled>下载 .md</button>
      <span id="action-hint" class="hint" style="margin:0"></span>
    </div>
  </section>

  <section class="panel">
    <label class="label" for="manual-input">② 漏掉了？手动补一条</label>
    <div class="row">
      <input id="manual-input" type="text" placeholder="例如：周五之前把初稿发我">
      <button id="add-btn" type="button">加入列表</button>
    </div>
    <p class="hint">手动补的条目会一直留着，再点「抽取」也不会被清掉。</p>
  </section>

</div>

<!--
  领域层（Domain）

  D-009 的结构约束：本块必须内联在 index.html 中。
  测试用 node:vm 读本文件、提取本块正文求值（见 tests/load-domain.mjs）。
  拆到独立的 .js 文件会破坏「双击即用」——file:// 下的跨文件加载行为不可靠。

  本层是纯函数：无 DOM、无网络、无存储、不读系统时间。
  规格来源：docs/construction/SUPPORTED_EXPRESSIONS.md
-->
<script id="zhaiwu-domain">
(function () {
  'use strict';

  // ==========================================================================
  // 数字
  // ==========================================================================

  var CN_DIGIT = {
    '零': 0, '〇': 0, '一': 1, '二': 2, '两': 2, '三': 3, '四': 4,
    '五': 5, '六': 6, '七': 7, '八': 8, '九': 9
  };

  // 数字 token：阿拉伯数字，或中文数字（覆盖面 0–99，够用于「十一月三日」「十一点」）
  var NUM = '(?:\\d{1,2}|[一二两三四五六七八九十]+)';
  // 「点」及可选的后缀：半 / 整 / Y分
  var TAIL = '\\s*点(?:\\s*(半|整)|\\s*(' + NUM + ')\\s*分)?';

  function cnNum(s) {
    if (s === null || s === undefined) return null;
    s = String(s);
    if (s === '') return null;
    if (/^\d+$/.test(s)) return parseInt(s, 10);

    var i = s.indexOf('十');
    if (i === -1) {
      if (s.length !== 1) return null;
      return Object.prototype.hasOwnProperty.call(CN_DIGIT, s) ? CN_DIGIT[s] : null;
    }
    var highPart = s.slice(0, i);
    var lowPart = s.slice(i + 1);
    var high = highPart === '' ? 1 : CN_DIGIT[highPart];
    var low = lowPart === '' ? 0 : CN_DIGIT[lowPart];
    if (high === undefined || high === null) return null;
    if (low === undefined || low === null) return null;
    return high * 10 + low;
  }

  // ==========================================================================
  // 日期工具
  // ==========================================================================

  function dayStart(d) {
    return new Date(d.getFullYear(), d.getMonth(), d.getDate());
  }

  function endOfDay(d) {
    return new Date(d.getFullYear(), d.getMonth(), d.getDate(), 23, 59, 0, 0);
  }

  function plusDays(d, n) {
    return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  }

  function atOn(day, h, mi) {
    return new Date(day.getFullYear(), day.getMonth(), day.getDate(), h, mi, 0, 0);
  }

  // 周一 = 1 … 周日 = 7
  function isoDow(d) {
    return ((d.getDay() + 6) % 7) + 1;
  }

  function mondayOf(d) {
    return plusDays(dayStart(d), 1 - isoDow(d));
  }

  // m 为 0-based 月份
  function daysInMonth(y, m) {
    return new Date(y, m + 1, 0).getDate();
  }

  // ==========================================================================
  // 日期段（§1.A）
  // kind 语义：
  //   'absolute' —— 已是完整时间点（期限类，后面不接时间点）
  //   'day'      —— 只到日。若紧跟一个显式时间点，该时间点生效；否则用
  //                 `h`/`m` 这个**缺省时刻**；连缺省也没有才取当天 23:59。
  //
  // `h`/`m` 是 Phase 8 加的。在此之前「今晚」「明早」被当成 'absolute'，
  // 它们自带的约定时刻会把后面显式写出的时间点整个吞掉——
  // 「今晚24点截止」解析成今天 20:00（比写出来的截止时刻早 4 小时，
  // 而且已经过去，列表上会显示成逾期）。约定时刻是**缺省值**，不是结论。
  // 详见 SUPPORTED_EXPRESSIONS.md §0「日期段自带的时刻是缺省值」。
  // ==========================================================================

  function weekdayDay(now, isoDay, weekOffset) {
    var d = plusDays(mondayOf(now), isoDay - 1 + weekOffset * 7);
    // 裸「周X」：该天已过则顺延到下一周
    if (weekOffset === 0 && d < dayStart(now)) d = plusDays(d, 7);
    return d;
  }

  function weekendDay(now) {
    // §1.A 约定：周末 = 周六
    var d = plusDays(mondayOf(now), 5);
    if (d < dayStart(now)) d = plusDays(d, 7);
    return d;
  }

  function yearlessMonthDay(now, mo, da) {
    if (mo === null || da === null) return null;
    if (mo < 1 || mo > 12) return null;
    var y = now.getFullYear();
    if (da < 1 || da > daysInMonth(y, mo - 1)) return null;
    var d = new Date(y, mo - 1, da);
    // 该日已过则顺延到下一年
    if (d < dayStart(now)) {
      if (da > daysInMonth(y + 1, mo - 1)) return null;
      d = new Date(y + 1, mo - 1, da);
    }
    return d;
  }

  var WEEKDAY_CHAR = { '一': 1, '二': 2, '三': 3, '四': 4, '五': 5, '六': 6, '日': 7, '天': 7 };

  var DATE_PATTERNS = [
    // 「日期 + 时段词」的复合表达。它们和「明天」一样是**日期段**，
    // 区别只在缺省时刻：不带时间点时才回落到 §1.A 的约定值。
    // `pmShift` 标记该表达的时段词是「晚」——它决定裸 `X点` 的 12/24（§0）。
    { re: /大后天/g, kind: 'day',
      make: function (m, now) { return plusDays(dayStart(now), 3); } },
    { re: /后天/g, kind: 'day',
      make: function (m, now) { return plusDays(dayStart(now), 2); } },
    { re: /明天早上|明早/g, kind: 'day', h: 9, m: 0,
      make: function (m, now) { return plusDays(dayStart(now), 1); } },
    { re: /明晚/g, kind: 'day', h: 20, m: 0, pmShift: true,
      make: function (m, now) { return plusDays(dayStart(now), 1); } },
    { re: /今晚/g, kind: 'day', h: 20, m: 0, pmShift: true,
      make: function (m, now) { return dayStart(now); } },
    { re: /明天|明日/g, kind: 'day',
      make: function (m, now) { return plusDays(dayStart(now), 1); } },
    { re: /今天|今日/g, kind: 'day',
      make: function (m, now) { return dayStart(now); } },

    // YYYY年X月X日 / X月X日
    { re: new RegExp('(\\d{4})\\s*年\\s*(' + NUM + ')\\s*月\\s*(' + NUM + ')\\s*[日号]', 'g'),
      kind: 'day',
      make: function (m) {
        var y = parseInt(m[1], 10), mo = cnNum(m[2]), da = cnNum(m[3]);
        if (mo === null || da === null) return null;
        if (mo < 1 || mo > 12) return null;
        if (da < 1 || da > daysInMonth(y, mo - 1)) return null;
        return new Date(y, mo - 1, da);
      } },
    { re: new RegExp('(' + NUM + ')\\s*月\\s*(' + NUM + ')\\s*[日号]', 'g'),
      kind: 'day',
      make: function (m, now) { return yearlessMonthDay(now, cnNum(m[1]), cnNum(m[2])); } },

    // X/X 与 X-Y（有歧义，v1 接受此代价，见 §1.A 备注）
    { re: /(?<!\d)(\d{1,2})\s*[/／]\s*(\d{1,2})(?!\d)/g,
      kind: 'day',
      make: function (m, now) { return yearlessMonthDay(now, cnNum(m[1]), cnNum(m[2])); } },
    { re: /(?<!\d)(\d{1,2})\s*-\s*(\d{1,2})(?![\d个天日月号点时年周])/g,
      kind: 'day',
      make: function (m, now) { return yearlessMonthDay(now, cnNum(m[1]), cnNum(m[2])); } },

    // 星期
    { re: /(?:周|星期|礼拜)([一二三四五六日天])/g, kind: 'day',
      make: function (m, now) { return weekdayDay(now, WEEKDAY_CHAR[m[1]], 0); } },
    { re: /(?:这周|本周)([一二三四五六日天])/g, kind: 'day',
      make: function (m, now) { return weekdayDay(now, WEEKDAY_CHAR[m[1]], 0); } },
    { re: /(?:下周|下星期|下礼拜)([一二三四五六日天])/g, kind: 'day',
      make: function (m, now) { return weekdayDay(now, WEEKDAY_CHAR[m[1]], 1); } },
    { re: /这周末|周末/g, kind: 'day',
      make: function (m, now) { return weekendDay(now); } }
  ];

  // ==========================================================================
  // 时间点段（§1.B）
  // kind: 'time'，值为 { h, m, infer12 }
  //   infer12 = true 表示「裸 X点」——没有时段词，需要按 12/24 小时推断
  // ==========================================================================

  function readHourMin(m) {
    var h = cnNum(m[1]);
    if (h === null) return null;
    var mi = 0;
    if (m[2] === '半') {
      mi = 30;
    } else if (m[3] !== undefined && m[3] !== null && m[3] !== '') {
      var t = cnNum(m[3]);
      if (t === null || t > 59) return null;
      mi = t;
    }
    return { h: h, m: mi };
  }

  function timePattern(re, infer12, shiftPm) {
    return {
      re: re,
      kind: 'time',
      make: function (m) {
        var p = readHourMin(m);
        if (p === null) return null;
        var h = p.h;
        if (shiftPm && h < 12) h = h + 12;
        return { h: h, m: p.m, infer12: infer12 };
      }
    };
  }

  // 时段词 + 冒号时刻（「下午16:00」「上午10:30」）。
  //
  // Phase 8 用真实语料补的规格缺口。§1.B 分别列了「下午X点」与「X:XX」，
  // 但没写明两者的交集，实现因此只认带「点」的前者——
  // 「下午16:00」整段落空，而 §3 明确承诺「日期段 + 时间点段」的组合成立。
  // 时段词的 12/24 修正对已经 ≥13 的时刻无害（16 不会再 +12）。
  function clockPattern(prefix, shiftPm) {
    return {
      re: new RegExp(prefix + '\\s*(\\d{1,2})\\s*[:：]\\s*(\\d{1,2})', 'g'),
      kind: 'time',
      make: function (m) {
        var h = parseInt(m[1], 10), mi = parseInt(m[2], 10);
        if (h > 23 || mi > 59) return null;
        if (shiftPm && h < 12) h = h + 12;
        return { h: h, m: mi, infer12: false };
      }
    };
  }

  var TIME_PATTERNS = [
    // 带时段词 —— 12/24 小时制已由时段词确定
    timePattern(new RegExp('(?:上午|早上|早晨)\\s*(' + NUM + ')' + TAIL, 'g'), false, false),
    timePattern(new RegExp('中午\\s*(' + NUM + ')' + TAIL, 'g'), false, false),
    timePattern(new RegExp('(?:下午|晚上)\\s*(' + NUM + ')' + TAIL, 'g'), false, true),
    timePattern(new RegExp('凌晨\\s*(' + NUM + ')' + TAIL, 'g'), false, false),

    // 带时段词的冒号时刻 —— 必须排在下面那条无前缀的 `X:XX` 之前，
    // 否则 timePointAt 在第 i 位会先撞上无前缀模式。见上方注释
    clockPattern('(?:上午|早上|早晨)', false),
    clockPattern('中午', false),
    clockPattern('(?:下午|晚上)', true),
    clockPattern('凌晨', false),

    // X:XX（半角或全角冒号）
    { re: /(\d{1,2})\s*[:：]\s*(\d{1,2})/g, kind: 'time',
      make: function (m) {
        var h = parseInt(m[1], 10), mi = parseInt(m[2], 10);
        if (h > 23 || mi > 59) return null;
        return { h: h, m: mi, infer12: false };
      } },

    // 单用「中午」—— §1.B 明确支持（与单用「下午/晚上/上午」不同）
    { re: /中午/g, kind: 'time',
      make: function () { return { h: 13, m: 0, infer12: false }; } },

    // 裸 X点 —— 需要 12/24 小时推断
    timePattern(new RegExp('(' + NUM + ')' + TAIL, 'g'), true, false)
  ];

  // ==========================================================================
  // 相对期限（§1.D）与紧迫词（§1.E）
  // ==========================================================================

  function thisWeekEnd(now) { return endOfDay(plusDays(mondayOf(now), 6)); }
  function nextWeekEnd(now) { return endOfDay(plusDays(mondayOf(now), 13)); }
  function thisMonthEnd(now) { return endOfDay(new Date(now.getFullYear(), now.getMonth() + 1, 0)); }

  function workdaysEnd(n, now) {
    if (n === null || n < 1 || n > 60) return null;
    var d = dayStart(now), count = 0;
    while (count < n) {
      d = plusDays(d, 1);
      var w = d.getDay();
      if (w !== 0 && w !== 6) count++;
    }
    return endOfDay(d);
  }

  function daysFromNow(m, now, mult) {
    var n = cnNum(m[1]);
    if (n === null || n < 0 || n > 365) return null;
    return endOfDay(plusDays(dayStart(now), n * mult));
  }

  var REL_PATTERNS = [
    { re: new RegExp('(' + NUM + ')\\s*(?:天|日)(?:内|后)', 'g'), kind: 'absolute',
      make: function (m, now) { return daysFromNow(m, now, 1); } },
    { re: new RegExp('(' + NUM + ')\\s*周(?:内|后)', 'g'), kind: 'absolute',
      make: function (m, now) { return daysFromNow(m, now, 7); } },
    { re: new RegExp('(' + NUM + ')\\s*个?星期(?:内|后)', 'g'), kind: 'absolute',
      make: function (m, now) { return daysFromNow(m, now, 7); } },
    { re: /(?:这周|本周)内/g, kind: 'absolute',
      make: function (m, now) { return thisWeekEnd(now); } },
    { re: /下周内/g, kind: 'absolute',
      make: function (m, now) { return nextWeekEnd(now); } },
    { re: /(?:这个月|本月)内/g, kind: 'absolute',
      make: function (m, now) { return thisMonthEnd(now); } },
    { re: new RegExp('(' + NUM + ')\\s*个工作日(?:内)?', 'g'), kind: 'absolute',
      make: function (m, now) { return workdaysEnd(cnNum(m[1]), now); } }
  ];

  // §1.E 紧迫词 —— 约定映射为 today 23:59，并标记 fuzzy
  var URGENCY_RE = /第一时间|马上就好|尽快|马上|抓紧|赶紧|立刻/g;

  // ==========================================================================
  // §2 明确不支持 —— 匹配到的区域先屏蔽，再解析
  // 这样「上周三」这类含受支持片段的表达不会被误解析成「周三」。
  // ==========================================================================

  var REJECT_PATTERNS = [
    // 双重相对星期
    /下下(?:个)?(?:周|星期|礼拜)[一二三四五六日天]?/g,
    // 模糊区间
    /下个?月/g,
    /(?:月[中底末]|中旬|上旬|下旬|季度[末底])/g,
    // 迟滞词（本质是「时间未定」，不是「时间未知」）
    /过几天|改天|有空时|有空|找时间|回头|这阵子|最近/g,
    // 过去的表达（作为截止时间无意义）
    /昨天|前天|昨日|前日/g,
    /上(?:周|星期|礼拜)[一二三四五六日天]?/g,
    /上次/g,
    // 农历与传统节日
    /农历/g,
    /(?:春节|国庆|中秋)(?:节)?(?:前|后)?/g,
    // 月份时长（月末对齐规则复杂）
    new RegExp('(' + NUM + ')\\s*个\\s*月', 'g'),
    // 精确到秒
    new RegExp(NUM + '\\s*点\\s*' + NUM + '\\s*分\\s*' + NUM + '\\s*秒', 'g')
  ];

  function maskRejects(text) {
    var chars = text.split('');
    var ranges = [];
    for (var k = 0; k < REJECT_PATTERNS.length; k++) {
      var re = REJECT_PATTERNS[k];
      re.lastIndex = 0;
      var m;
      while ((m = re.exec(text)) !== null) {
        var b = m.index, e = m.index + m[0].length;
        ranges.push([b, e]);
        for (var i = b; i < e; i++) chars[i] = ' ';
        if (m[0] === '') re.lastIndex++;
      }
    }
    return { text: chars.join(''), ranges: ranges };
  }

  // ==========================================================================
  // 解析主流程
  // ==========================================================================

  function collectCandidates(text, now) {
    var out = [];
    var lists = [DATE_PATTERNS, REL_PATTERNS, TIME_PATTERNS];

    for (var li = 0; li < lists.length; li++) {
      var list = lists[li];
      for (var pi = 0; pi < list.length; pi++) {
        var p = list[pi];
        p.re.lastIndex = 0;
        var m;
        while ((m = p.re.exec(text)) !== null) {
          var v = p.make(m, now);
          if (v !== null) {
            out.push({
              index: m.index, length: m[0].length, kind: p.kind, value: v,
              // 日期段可带缺省时刻（`今晚` 的 20:00）与时段词标记（`pmShift`）
              h: p.h, m: p.m, pmShift: p.pmShift
            });
          }
          if (m[0] === '') p.re.lastIndex++;
        }
      }
    }

    URGENCY_RE.lastIndex = 0;
    var um;
    while ((um = URGENCY_RE.exec(text)) !== null) {
      out.push({ index: um.index, length: um[0].length, kind: 'urgency', value: null });
      if (um[0] === '') URGENCY_RE.lastIndex++;
    }

    return out;
  }

  // §0：一句话多个时间表达，取最靠左的第一个；同位置取最长的
  function pickLeftmost(list) {
    if (list.length === 0) return null;
    var best = list[0];
    for (var i = 1; i < list.length; i++) {
      var c = list[i];
      if (c.index < best.index || (c.index === best.index && c.length > best.length)) best = c;
    }
    return best;
  }

  var TIME_TAIL_SKIP = /[\s，,、]/;
  var BRACKET_PAIRS = { '（': '）', '(': ')' };
  // 括号插入语的长度上限。超过就认为不是同位语注释，而是别的内容。
  var BRACKET_MAX = 20;

  // 跳过「日期段」与「时间点段」之间允许出现的填充物：
  // 空白、`，,、`，以及**一个完整闭合的括号插入语**。
  //
  // 括号这一条是 Phase 8 用真实语料补的。规格初稿只允许空白与 `，,、`，
  // 而「10月11日（本周日）下午四点」这种写法在真实通知里极常见——
  // 括号里写星期几是**同位语注释**，不是在换话题，不该切断组合。
  // 只跳成对闭合且不长的括号；未闭合或过长一律视为话题已断，保持原行为。
  function skipBetween(text, pos) {
    var i = pos;
    for (;;) {
      while (i < text.length && TIME_TAIL_SKIP.test(text[i])) i++;
      var close = BRACKET_PAIRS[text[i]];
      if (close === undefined) return i;
      var end = text.indexOf(close, i + 1);
      if (end === -1 || end - i > BRACKET_MAX) return i;
      i = end + 1;
    }
  }

  // 在 pos 处（允许跳过少量分隔符）找一个时间点，用于「日期 + 时间点」组合
  function timePointAt(text, pos) {
    var i = skipBetween(text, pos);
    if (i >= text.length) return null;
    for (var k = 0; k < TIME_PATTERNS.length; k++) {
      var p = TIME_PATTERNS[k];
      p.re.lastIndex = i;
      var m = p.re.exec(text);
      if (m !== null && m.index === i) return p.make(m);
    }
    return null;
  }

  // 时间点已过去、且未指定日期 → 次日（§0）
  function resolveTimeOnly(tp, now) {
    var base = dayStart(now);
    var next = plusDays(base, 1);

    if (tp.infer12) {
      // 裸 X点：候选顺序为今日 X:00 → 今日 (X+12):00 → 次日 X:00，取第一个晚于 now 的
      var cands = [atOn(base, tp.h, tp.m)];
      if (tp.h + 12 < 24) cands.push(atOn(base, tp.h + 12, tp.m));
      cands.push(atOn(next, tp.h, tp.m));
      for (var i = 0; i < cands.length; i++) {
        if (cands[i].getTime() > now.getTime()) return cands[i];
      }
      return cands[cands.length - 1];
    }

    var d = atOn(base, tp.h, tp.m);
    if (d.getTime() <= now.getTime()) d = atOn(next, tp.h, tp.m);
    return d;
  }

  /**
   * 解析一段文本里的截止时间。
   *
   * @param {string} text 待解析文本（一行聊天原文）
   * @param {Date}   now  基准时间，由调用方注入 —— 本层绝不自己读系统时间
   * @returns {{ date: Date|null, fuzzy: boolean }}
   */
  function timeParserDetail(text, now) {
    assertNow(now);
    if (typeof text !== 'string' || text === '') return { date: null, fuzzy: false };

    var masked = maskRejects(text);
    var best = pickLeftmost(collectCandidates(masked.text, now));
    if (best === null) return { date: null, fuzzy: false };

    // 若候选紧贴在被屏蔽区域之后，说明它是被否决表达的一部分（如「下下周三下午三点」）
    for (var i = 0; i < masked.ranges.length; i++) {
      if (masked.ranges[i][1] === best.index) return { date: null, fuzzy: false };
    }

    if (best.kind === 'urgency') {
      return { date: endOfDay(dayStart(now)), fuzzy: true };
    }
    if (best.kind === 'absolute') {
      return { date: best.value, fuzzy: false };
    }
    if (best.kind === 'day') {
      var tp = timePointAt(masked.text, best.index + best.length);
      if (tp !== null) {
        var h = tp.h;
        // 「今晚」「明晚」自带时段词「晚」，它决定 12/24（§0：带时段词者制式已定），
        // 因此裸 `X点` 的跨日推断在这里不适用，改由时段词修正。
        if (tp.infer12 && best.pmShift === true && h < 12) h = h + 12;
        return { date: atOn(best.value, h, tp.m), fuzzy: false };
      }
      // 没有显式时间点，才回落到该日期段的缺省时刻
      if (best.h !== undefined) {
        return { date: atOn(best.value, best.h, best.m), fuzzy: false };
      }
      return { date: endOfDay(best.value), fuzzy: false };
    }
    return { date: resolveTimeOnly(best.value, now), fuzzy: false };
  }

  /**
   * 对外契约：把文本里的时间表达转成绝对时间。
   *
   * @param {string} text
   * @param {Date}   now
   * @returns {Date|null}
   */
  function timeParser(text, now) {
    return timeParserDetail(text, now).date;
  }

  // ==========================================================================
  // 动作词表（SUPPORTED_EXPRESSIONS.md §4，数据化）
  // ==========================================================================

  /**
   * 正向词表：命中即认为这一行在说「有件事要做」。
   * 类别只用于文档与调试，判定时拍平成一个列表。
   */
  var ACTION_WORDS = {
    '请求': ['麻烦', '请你', '帮忙', '帮我', '需要你', '给我', '发我', '找一下', '交给你', '麻烦你'],
    '提醒': ['记得', '别忘了', '不要忘记', '提醒我', '注意'],
    '交付推进': ['提交', '上传', '发', '回复', '确认', '处理', '安排', '完成', '跟进', '核对',
      '整理', '更新', '准备', '修改', '检查', '落实', '对接', '审批', '同步'],
    '截止': ['截止', 'deadline', '之前给我', '之前发我'],
    // 紧迫词：直接取自 §1.E 已冻结的清单，不是新判断 —— 含这类词的句子必然在说
    // 一件要做的事。缺了这一项，「尽快把环境搭好」会整句漏掉，§1.E 的紧迫映射
    // 也就永远没机会生效。
    '紧迫': ['尽快', '马上', '抓紧', '赶紧', '第一时间', '立刻'],
    // Phase 5 补充：§4 已注明该表是初稿、实现时扩充。以下 12 个词是工作/学习聊天里
    // 近乎无歧义的「有件事要做」标记（「周三下午开会」这种句子原本会被整句漏掉）。
    // 它们是判断，不是数据 —— 待 Phase 8 用真实语料校准，可能增也可能删。
    'Phase5补充': ['开会', '会议', '汇报', '参加', '报名', '签到', '出差', '报销',
      '缴费', '预约', '取件', '反馈']
  };

  var ACTION_WORD_LIST = (function () {
    var all = [];
    for (var cat in ACTION_WORDS) {
      if (Object.prototype.hasOwnProperty.call(ACTION_WORDS, cat)) {
        all = all.concat(ACTION_WORDS[cat]);
      }
    }
    return all;
  })();

  /** 反向词表（§4）：整行都是这类词时，这一行不是任务。 */
  var FILLER_WORDS = [
    '收到', '好的', '好', '嗯', '哦', '明白了', '了解', '没问题', '辛苦了', '谢谢', '谢了',
    '哈哈', '哈哈哈', '在吗', '早', '早安', '晚安', '已阅', 'OK', 'ok', '嗯嗯'
  ];

  // 长的在前：剥离时先试「好的」再试「好」，否则「好的」会剩一个「的」剥不干净
  var FILLER_SORTED = FILLER_WORDS.slice()
    .map(function (w) { return w.toLowerCase(); })
    .sort(function (a, b) { return b.length - a.length; });

  /**
   * 这一行是否**整行都是**寒暄/确认语。
   *
   * 判定是整行，不是子串 —— 「收到，明天发你」含「收到」但它是个任务。
   * 剥掉标点与空白后若被反向词完全吃光，才算寒暄。
   */
  function isFillerLine(line) {
    var s = String(line).replace(/[\s\p{P}\p{S}]/gu, '').toLowerCase();
    if (s === '') return true;
    var changed = true;
    while (changed) {
      changed = false;
      for (var i = 0; i < FILLER_SORTED.length; i++) {
        var w = FILLER_SORTED[i];
        if (w !== '' && s.slice(0, w.length) === w) {
          s = s.slice(w.length);
          changed = true;
          break;
        }
      }
    }
    return s === '';
  }

  /** 命中任一正向词则返回该词，否则 null（返回词本身，便于调试与测试断言） */
  function actionWordIn(line) {
    var lower = String(line).toLowerCase();
    for (var i = 0; i < ACTION_WORD_LIST.length; i++) {
      var w = ACTION_WORD_LIST[i].toLowerCase();
      if (lower.indexOf(w) !== -1) return ACTION_WORD_LIST[i];
    }
    return null;
  }

  /**
   * 单行判定：这一行是不是候选任务句。
   *
   * 只回答「是不是」，不解析时间、不构造 Task —— 见 LAYER_CONTRACT.md 的子模块边界。
   */
  function isTaskLine(line) {
    if (typeof line !== 'string') return false;
    var t = line.trim();
    if (t === '') return false;
    if (isFillerLine(t)) return false;
    return actionWordIn(t) !== null;
  }

  function splitLines(text) {
    return text.split(/\r?\n/);
  }

  /**
   * 从整段文本里挑出候选任务句。
   *
   * @param {string} text
   * @returns {string[]} 去首尾空白后的候选行，保持原顺序
   */
  function taskExtractor(text) {
    if (typeof text !== 'string') return [];
    var lines = splitLines(text);
    var out = [];
    for (var i = 0; i < lines.length; i++) {
      if (isTaskLine(lines[i])) out.push(lines[i].trim());
    }
    return out;
  }

  // ==========================================================================
  // Task 构造与排序
  // ==========================================================================

  /**
   * 规范化一个 Task。UI 层手动补漏时也用它，避免手搓对象漏字段。
   *
   * Task 的权威定义见 ARCHITECTURE.md「数据模型」。
   */
  function makeTask(input) {
    return {
      id: input.id,
      text: input.text,
      deadline: input.deadline === undefined ? null : input.deadline,
      fuzzy: input.fuzzy === true,
      source: input.source,
      raw: input.raw === undefined ? '' : input.raw
    };
  }

  /**
   * 排序：有截止时间的按升序在前，无截止时间的垫底（各有各的组内原顺序）。
   *
   * 「分组」不体现在返回值形状上 —— 分界线就是 `deadline === null`，
   * UI 一次 filter 即可分两段渲染。
   *
   * @param {Array} tasks
   * @returns {Array} 新数组，不修改入参
   */
  function sorter(tasks) {
    var copy = tasks.slice();
    copy.sort(function (a, b) {
      var ad = a.deadline, bd = b.deadline;
      var an = (ad === null || ad === undefined);
      var bn = (bd === null || bd === undefined);
      if (an && bn) return 0;
      if (an) return 1;
      if (bn) return -1;
      return ad.getTime() - bd.getTime();
    });
    return copy;
  }

  function assertNow(now) {
    if (!now || typeof now.getTime !== 'function' || isNaN(now.getTime())) {
      throw new TypeError('timeParser 需要注入有效的 now（Date）');
    }
  }

  /**
   * 对外契约：文本 → Task[]，已按紧急度排好。
   *
   * 组合三个互不调用的子模块：taskExtractor 判定 → timeParser 解析时间 → sorter 排序。
   *
   * @param {string} text 粘贴的聊天文本
   * @param {Date}   now  基准时间，由调用方注入
   * @returns {Array} Task[]
   */
  function parse(text, now) {
    assertNow(now);
    if (typeof text !== 'string' || text === '') return [];

    var lines = splitLines(text);
    var tasks = [];
    for (var i = 0; i < lines.length; i++) {
      if (!isTaskLine(lines[i])) continue;
      var line = lines[i].trim();
      var parsed = timeParserDetail(line, now);
      tasks.push(makeTask({
        id: 'r' + i,          // 确定性 id：行号。领域层须可测，不能用随机数
        text: line,
        deadline: parsed.date,
        fuzzy: parsed.fuzzy,
        source: 'rule',
        raw: lines[i]         // 原文，用于 UI 核对
      }));
    }
    return sorter(tasks);
  }

  globalThis.__zhaiwuDomain = {
    version: 'Phase 5',
    timeParser: timeParser,
    timeParserDetail: timeParserDetail,
    taskExtractor: taskExtractor,
    isTaskLine: isTaskLine,
    sorter: sorter,
    makeTask: makeTask,
    parse: parse
  };
})();
</script>

<!--
  交付层（Phase 7）

  把 Task[] 渲染成 Markdown。**纯函数**：字符串进、字符串出。
  不碰 DOM、不碰网络、不读系统时间——它连 now 都不需要。

  这里**不**做复制与下载。那两个动作要碰浏览器 API（剪贴板、Blob），
  属于 UI 层。本层存在的意义就是把「生成什么」和「怎么送出去」分开：
  前者可以测试，后者只能人工验证。

  单独一个 script 块的理由同 UI 层：领域层纯度静态检查只扫 zhaiwu-domain。
-->
<script id="zhaiwu-delivery">
(function () {
  'use strict';

  function pad2(n) { return String(n).padStart(2, '0'); }

  // 与 UI 层的 fmtDeadline 是有意的重复，不是疏漏。
  // 两处的展示需求可能分化（界面要短，Markdown 要完整），
  // 共用会让两层耦合在一个最容易变的细节上。各 5 行，不值得抽。
  function fmtDeadline(d) {
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) +
      ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }

  // 转义 Markdown 行内元字符。
  // 任务文本来自用户粘贴的聊天记录：一条含 [ 的任务会把后续内容全变成链接，
  // 直接破坏可读性——而「可读」是本阶段的验收标准。
  // 只转义行内敏感的字符；#、-、+ 这类只在行首才有块级语义，而任务文本
  // 永远跟在 '- [ ] ' 之后，不在行首。
  // 转义后渲染出来仍是原文（\* 显示为 *），可读性不降。
  function escapeMd(s) {
    return String(s === undefined || s === null ? '' : s)
      // 换行会把一个列表项截成两行，第二行不再是列表项。
      // 当前数据流下不该出现（领域层按行切分、手动补漏是单行 input），
      // 但防御成本只有一次 replace，不值得留这个口子。
      .replace(/\r?\n/g, ' ')
      .replace(/[\\`*_[\]]/g, '\\$&');
  }

  function isTimed(t) {
    return t.deadline !== null && t.deadline !== undefined;
  }

  function taskLine(t) {
    var marks = [];
    if (t.fuzzy) marks.push('推定');
    if (t.source === 'manual') marks.push('手动补的');
    var suffix = marks.length > 0 ? '（' + marks.join(' · ') + '）' : '';

    if (isTimed(t)) {
      return '- [ ] ' + fmtDeadline(t.deadline) + ' · ' + escapeMd(t.text) + suffix;
    }
    return '- [ ] ' + escapeMd(t.text) + suffix;
  }

  // 分组沿用产品需求规定的二分：有截止时间 / 未识别到时间。
  // 来源（rule / manual）与 fuzzy 是**行内标记**，不是第三个分组。
  function renderMarkdown(tasks) {
    var list = tasks || [];
    var out = ['# 摘务', ''];

    if (list.length === 0) {
      out.push('没有任务。');
      return out.join('\n') + '\n';
    }

    out.push('共 ' + list.length + ' 条任务。');

    var timed = [], untimed = [];
    for (var i = 0; i < list.length; i++) {
      (isTimed(list[i]) ? timed : untimed).push(list[i]);
    }

    if (timed.length > 0) {
      out.push('', '## 有截止时间（' + timed.length + '）', '');
      for (var j = 0; j < timed.length; j++) out.push(taskLine(timed[j]));
    }
    if (untimed.length > 0) {
      out.push('', '## 未识别到时间（' + untimed.length + '）', '');
      for (var k = 0; k < untimed.length; k++) out.push(taskLine(untimed[k]));
    }

    return out.join('\n') + '\n';
  }

  globalThis.__zhaiwuDelivery = {
    version: 'Phase 7',
    renderMarkdown: renderMarkdown
  };
})();
</script>

<!--
  UI 层（Phase 6）

  依赖方向：UI → 领域层（见 LAYER_CONTRACT.md）。
  本层**不内嵌任何正则或词表**——识别规则只允许存在于上面的领域层。
  本层唯一的额外职责是「读浏览器当前时间并注入领域层」：领域层绝不自己读时间。

  刻意与领域层分成两个 script 块：纯度静态检查只扫 zhaiwu-domain 那一块
  （tests/load-domain.mjs 的正则非贪婪匹配），UI 代码混进去会让检查失效。
-->
<script id="zhaiwu-ui">
(function () {
  'use strict';

  var domain = globalThis.__zhaiwuDomain;
  if (!domain || typeof domain.parse !== 'function') {
    document.getElementById('results').textContent =
      '领域层未加载，界面无法工作。请确认 index.html 未被拆分或改动。';
    return;
  }

  var chatInput = document.getElementById('chat-input');
  var extractBtn = document.getElementById('extract-btn');
  var resultsEl = document.getElementById('results');
  var manualInput = document.getElementById('manual-input');
  var addBtn = document.getElementById('add-btn');
  var hintEl = document.getElementById('hint');
  var copyBtn = document.getElementById('copy-btn');
  var downloadBtn = document.getElementById('download-btn');
  var actionHint = document.getElementById('action-hint');

  // 交付层缺失只影响「导出」，不影响筛选本身，所以降级而不是整体停摆。
  var delivery = globalThis.__zhaiwuDelivery;
  var hasDelivery = !!(delivery && typeof delivery.renderMarkdown === 'function');
  if (!hasDelivery) {
    copyBtn.title = downloadBtn.title = '交付层未加载，导出不可用';
  }

  var ruleTasks = [];      // 最近一次「抽取」的结果
  var manualTasks = [];    // 手动补的条目，跨抽取保留
  var tasks = [];          // 展示用 = sorter(ruleTasks + manualTasks)
  var hasExtracted = false;
  var manualSeq = 0;

  // ---- 展示 ----------------------------------------------------------------

  function pad2(n) { return String(n).padStart(2, '0'); }

  function fmtDeadline(d) {
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) +
      ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }

  // 全部用 textContent 构造：任务文本来自用户粘贴的聊天记录，
  // 走 innerHTML 会把记录里的标签当成 HTML 执行。
  function taskNode(t) {
    var li = document.createElement('li');
    li.className = 'task';

    var when = document.createElement('span');
    when.className = (t.deadline === null ? 'task-when none' : 'task-when');
    when.textContent = (t.deadline === null ? '未识别到时间' : fmtDeadline(t.deadline));
    li.appendChild(when);

    var text = document.createElement('span');
    text.className = 'task-text';
    text.textContent = t.text;

    if (t.fuzzy) {
      // D-010：紧迫词是「约定映射」而非对方原话，必须让用户看出来
      var b = document.createElement('span');
      b.className = 'badge';
      b.textContent = '推定';
      b.title = '来自「尽快 / 马上 / 抓紧」这类紧迫词，按今天结束前计算。' +
        '这不是对方说的明确时间。';
      text.appendChild(b);
    }
    if (t.source === 'manual') {
      var m = document.createElement('span');
      m.className = 'badge manual';
      m.textContent = '手动补的';
      text.appendChild(m);
    }
    li.appendChild(text);

    var del = document.createElement('button');
    del.type = 'button';
    del.className = 'task-del';
    del.textContent = '删除';
    del.title = '从列表移除';
    del.addEventListener('click', function () { removeTask(t.id); });
    li.appendChild(del);

    return li;
  }

  function groupNode(title, list) {
    var sec = document.createElement('div');
    sec.className = 'group';

    var h = document.createElement('p');
    h.className = 'group-title';
    h.textContent = title + '（' + list.length + '）';
    sec.appendChild(h);

    var ul = document.createElement('ul');
    ul.className = 'tasks';
    for (var i = 0; i < list.length; i++) ul.appendChild(taskNode(list[i]));
    sec.appendChild(ul);

    return sec;
  }

  function render() {
    resultsEl.textContent = '';

    var empty = tasks.length === 0;
    copyBtn.disabled = empty || !hasDelivery;
    downloadBtn.disabled = empty || !hasDelivery;

    if (empty) {
      var p = document.createElement('p');
      p.className = 'empty';
      if (hasExtracted) {
        // 规则一定会漏。空结果必须给出路，否则用户会以为坏了。
        var strong = document.createElement('strong');
        strong.textContent = '没识别到任务。';
        p.appendChild(strong);
        p.appendChild(document.createTextNode(
          '规则认的是动作词（提交 / 发我 / 记得…）和时间词，口语化的说法容易漏。' +
          '用下面的输入框手动补一条。'));
      } else {
        p.textContent = '粘贴聊天记录后点「抽取」。';
      }
      resultsEl.appendChild(p);
      return;
    }

    var timed = [], untimed = [];
    for (var i = 0; i < tasks.length; i++) {
      (tasks[i].deadline === null ? untimed : timed).push(tasks[i]);
    }

    if (timed.length > 0) resultsEl.appendChild(groupNode('有截止时间', timed));
    if (untimed.length > 0) resultsEl.appendChild(groupNode('未识别到时间', untimed));
  }

  // ---- 状态 ----------------------------------------------------------------

  function recompute() {
    tasks = domain.sorter(ruleTasks.concat(manualTasks));
    render();
  }

  function runExtract() {
    // 领域层绝不自己读时间（LAYER_CONTRACT.md）——由 UI 读取并注入
    var now = new Date();
    ruleTasks = domain.parse(chatInput.value, now);
    hasExtracted = true;

    recompute();

    var n = ruleTasks.length, m = manualTasks.length;
    hintEl.textContent = (n === 0 ? '没识别到任务句' : '识别到 ' + n + ' 条') +
      (m > 0 ? '，另有 ' + m + ' 条手动补的' : '');
  }

  function removeTask(id) {
    ruleTasks = ruleTasks.filter(function (t) { return t.id !== id; });
    manualTasks = manualTasks.filter(function (t) { return t.id !== id; });
    recompute();
  }

  function addManual() {
    var text = manualInput.value.trim();
    if (text === '') return;

    // 手动补的条目也解析时间——用户完全可能写「周五之前把初稿发我」
    var parsed = domain.timeParserDetail(text, new Date());

    manualSeq += 1;
    manualTasks.push(domain.makeTask({
      id: 'm' + manualSeq,
      text: text,
      deadline: parsed.date,
      fuzzy: parsed.fuzzy,
      source: 'manual',
      raw: ''        // 手动条目没有聊天原文可核对
    }));
    manualInput.value = '';
    recompute();
    manualInput.focus();
  }

  // ---- 导出（复制 / 下载）---------------------------------------------------

  function flashAction(msg) {
    actionHint.textContent = msg;
    setTimeout(function () { actionHint.textContent = ''; }, 2500);
  }

  // 老办法：选中一个屏幕外的 textarea 再 execCommand。
  //
  // execCommand 已被标记废弃，但它仍是 clipboard API 不可用时的唯一退路——
  // 而 file:// 下 clipboard API 能不能用，取决于浏览器是否把 file:// 当作
  // 安全上下文，这一点各家不同。**不能静默失败**，所以留了这一级。
  function legacyCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();

    var ok = false;
    try { ok = document.execCommand('copy'); } catch (err) { ok = false; }

    document.body.removeChild(ta);
    return ok;
  }

  var COPY_FAILED = '浏览器拦下了复制，请手动选中结果复制';

  function doCopy() {
    var text = delivery.renderMarkdown(tasks);

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(
        function () { flashAction('已复制到剪贴板'); },
        // API 存在但被拒（权限、非安全上下文）——退到老办法，再不行就明说
        function () { flashAction(legacyCopy(text) ? '已复制到剪贴板' : COPY_FAILED); }
      );
      return;
    }

    flashAction(legacyCopy(text) ? '已复制到剪贴板' : COPY_FAILED);
  }

  function stamp() {
    var d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }

  function doDownload() {
    var blob = new Blob([delivery.renderMarkdown(tasks)],
      { type: 'text/markdown;charset=utf-8' });
    var url = URL.createObjectURL(blob);

    var a = document.createElement('a');
    a.href = url;
    a.download = '摘务-' + stamp() + '.md';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    // 立刻 revoke 有打断下载的可能，推迟释放；不 revoke 则 blob 常驻内存
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    flashAction('已开始下载');
  }

  // ---- 事件 ----------------------------------------------------------------

  extractBtn.addEventListener('click', runExtract);
  addBtn.addEventListener('click', addManual);
  if (hasDelivery) {
    copyBtn.addEventListener('click', doCopy);
    downloadBtn.addEventListener('click', doDownload);
  }

  // 粘贴区 Ctrl/Cmd+Enter 直接抽取；补漏框 Enter 直接加入
  chatInput.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      runExtract();
    }
  });
  manualInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      addManual();
    }
  });

  render();
})();
</script>

</body>
</html>
